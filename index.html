<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I Sabbiastorie — Sand Art, voce e teatro</title>
  <meta name="description" content="Spettacoli di Sand Art, voce e teatro.">
  <meta name="theme-color" content="#080503">
  <meta property="og:type" content="website">
  <meta property="og:title" content="I Sabbiastorie">
  <meta property="og:description" content="La sabbia racconta.">
  <meta property="og:image" content="https://i-sabbiastorie.furiovito.workers.dev/assets/images/anteprima-social.jpg">
  <link rel="canonical" href="https://i-sabbiastorie.furiovito.workers.dev/">
  <style>
    :root{
      --black:#070403;--black-2:#120a06;--gold:#e7b15b;--gold-light:#f6d48d;
      --cream:#fff3dc;--muted:#cbbba4;--line:rgba(255,235,200,.14);
      --radius:28px;--max:1220px
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;color:var(--cream);font-family:Arial,Helvetica,sans-serif;line-height:1.6;
      background:
        radial-gradient(circle at 15% 0%,rgba(231,177,91,.10),transparent 27%),
        radial-gradient(circle at 88% 12%,rgba(140,76,31,.13),transparent 23%),
        linear-gradient(180deg,var(--black-2),var(--black))
    }
    img{display:block;max-width:100%}
    a{color:inherit}
    .wrap{width:min(var(--max),calc(100% - 30px));margin:auto}

    .hero{min-height:92svh;background:#030201;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
    .hero img{width:100%;height:92svh;object-fit:contain;object-position:center;background:#030201}

    .slogan{
      padding:54px 20px 42px;text-align:center;
      background:
        radial-gradient(circle at 50% 0%,rgba(231,177,91,.16),transparent 44%),
        linear-gradient(180deg,#160b06,#0d0704)
    }
    .slogan h1{
      margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;
      font-size:clamp(3rem,8vw,7.5rem);line-height:.95;color:var(--gold-light);letter-spacing:-.035em
    }
    .slogan p{margin:18px auto 0;color:var(--muted);max-width:650px;font-size:1.04rem}

    .site-nav{
      position:sticky;top:0;z-index:50;background:rgba(8,4,3,.90);
      backdrop-filter:blur(16px);border-block:1px solid var(--line)
    }
    .nav-inner{min-height:74px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:10px 0}
    .nav-inner a{
      text-decoration:none;color:#eadbc4;font-size:.78rem;font-weight:700;
      letter-spacing:.11em;text-transform:uppercase;padding:10px 14px;border-radius:999px
    }
    .nav-inner a:hover{background:rgba(255,255,255,.07);color:white}

    main{padding:16px 0 78px}
    .panel{
      margin-top:22px;padding:40px;border-radius:var(--radius);
      background:linear-gradient(180deg,rgba(43,25,14,.86),rgba(20,11,6,.94));
      border:1px solid var(--line);box-shadow:0 20px 55px rgba(0,0,0,.24)
    }
    .eyebrow{color:var(--gold);font-size:.72rem;font-weight:700;letter-spacing:.17em;text-transform:uppercase}
    h2{
      font-family:Georgia,"Times New Roman",serif;font-weight:400;
      font-size:clamp(2.5rem,5vw,4.8rem);line-height:.95;margin:12px 0 15px
    }
    .lead{color:var(--muted);max-width:770px}

    .about-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:28px}
    .about-copy p{color:var(--muted);font-size:1.06rem;margin:0 0 16px}
    .duo{display:grid;gap:14px}
    .person{padding:22px;border-radius:22px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
    .person h3{font-family:Georgia,serif;font-size:1.85rem;margin:0 0 5px}
    .person p{margin:0;color:var(--muted)}

    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:25px}
    .card{overflow:hidden;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
    .card-image{aspect-ratio:16/10;overflow:hidden;background:#160c07}
    .card-image img{width:100%;height:100%;object-fit:cover;transition:.45s;filter:saturate(.93) contrast(1.04)}
    .card:hover img{transform:scale(1.035)}
    .card-body{padding:22px}
    .tag{display:inline-block;color:var(--gold);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
    .card h3{font-family:Georgia,serif;font-size:2rem;line-height:1;margin:9px 0 10px}
    .card p{margin:0;color:var(--muted)}

    .repertoire-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:26px;align-items:start}
    .rep-list{display:grid;gap:11px}
    .rep-item{
      padding:14px 16px;border-radius:17px;background:rgba(255,255,255,.035);
      border:1px solid rgba(255,255,255,.05)
    }
    .rep-item strong{display:block;font-family:Georgia,serif;font-weight:400;font-size:1.12rem}
    .rep-item small{display:block;color:var(--muted);margin-top:3px}

    .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
    .shot{
      margin:0;padding:9px;border-radius:18px;background:#f2dfbc;color:#211307;cursor:pointer;
      box-shadow:0 12px 32px rgba(0,0,0,.24)
    }
    .shot img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:13px}
    .shot figcaption{padding:10px 5px 4px;font-size:.91rem;font-weight:600}

    blockquote{
      margin:0;text-align:center;font-family:Georgia,serif;
      font-size:clamp(2.1rem,5vw,4.4rem);line-height:1.05;color:#f9dfae
    }
    .quote-panel{
      background:
        radial-gradient(circle at 50% 0%,rgba(236,183,91,.16),transparent 40%),
        linear-gradient(135deg,rgba(103,52,21,.38),rgba(32,18,10,.84))
    }

    .contact-grid{display:grid;grid-template-columns:1fr .9fr;gap:24px}
    .contact-card{display:grid;gap:11px}
    .contact-link,.location{
      padding:15px 16px;border-radius:17px;background:rgba(255,255,255,.04);border:1px solid var(--line)
    }
    .contact-link{text-decoration:none}
    .contact-link strong{display:block;color:var(--gold);font-size:.71rem;letter-spacing:.12em;text-transform:uppercase}
    .contact-link span{display:block;margin-top:3px;font-weight:600}
    .location{color:var(--muted)}

    footer{padding:25px 0 38px;color:var(--muted);font-size:.86rem}
    .lightbox{
      position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:none;
      align-items:center;justify-content:center;padding:22px
    }
    .lightbox.open{display:flex}
    .lightbox img{max-width:94vw;max-height:86vh;border-radius:16px}
    .close{
      position:absolute;right:18px;top:14px;width:48px;height:48px;border-radius:50%;
      border:0;background:rgba(255,255,255,.14);color:white;font-size:2rem;cursor:pointer
    }

    @media(max-width:980px){
      .about-grid,.repertoire-grid,.contact-grid{grid-template-columns:1fr}
      .gallery{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:720px){
      .hero{min-height:auto}
      .hero img{height:auto;min-height:54svh;object-fit:contain}
      .slogan{padding:40px 18px 32px}
      .cards,.gallery{grid-template-columns:1fr}
      .panel{padding:25px}
      .nav-inner a{font-size:.69rem;padding:8px 9px}
    }
  </style>
</head>
<body>

<section class="hero" id="top">
  <img id="hero-image" src="assets/images/logo-copertina-sabbiastorie.webp" alt="I Sabbiastorie">
</section>

<section class="slogan">
  <h1 id="hero-text">La sabbia racconta.</h1>
  <p id="hero-subtext"></p>
</section>

<nav class="site-nav">
  <div class="wrap nav-inner">
    <a id="menu-chi" href="#chi-siamo"></a>
    <a id="menu-spettacoli" href="#spettacoli"></a>
    <a id="menu-repertorio" href="#repertorio"></a>
    <a id="menu-galleria" href="#galleria"></a>
    <a id="menu-contatti" href="#contatti"></a>
  </div>
</nav>

<main>
  <div class="wrap">
    <section class="panel about-grid" id="chi-siamo">
      <div class="about-copy">
        <span class="eyebrow" id="label-chi"></span>
        <h2 id="profile-title"></h2>
        <p id="profile-p1"></p>
        <p id="profile-p2"></p>
      </div>
      <div class="duo">
        <article class="person"><h3 id="vito-name"></h3><p id="vito-role"></p></article>
        <article class="person"><h3 id="daniela-name"></h3><p id="daniela-role"></p></article>
      </div>
    </section>

    <section class="panel" id="spettacoli">
      <span class="eyebrow" id="label-shows"></span>
      <h2 id="title-shows"></h2>
      <p class="lead" id="text-shows"></p>
      <div class="cards" id="cards"></div>
    </section>

    <section class="panel repertoire-grid" id="repertorio">
      <div>
        <span class="eyebrow" id="label-rep"></span>
        <h2 id="title-rep"></h2>
        <p class="lead" id="text-rep"></p>
      </div>
      <div class="rep-list" id="rep-list"></div>
    </section>

    <section class="panel" id="galleria">
      <span class="eyebrow" id="label-gallery"></span>
      <h2 id="title-gallery"></h2>
      <p class="lead" id="text-gallery"></p>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="panel quote-panel">
      <blockquote id="quote"></blockquote>
    </section>

    <section class="panel contact-grid" id="contatti">
      <div>
        <span class="eyebrow" id="label-contacts"></span>
        <h2 id="contact-title"></h2>
        <p class="lead" id="contact-text"></p>
      </div>
      <div class="contact-card">
        <a class="contact-link" id="email-link"><strong id="email-label"></strong><span></span></a>
        <a class="contact-link" id="phone-link"><strong id="phone-label"></strong><span></span></a>
        <div class="location" id="location"></div>
      </div>
    </section>
  </div>
</main>

<footer><div class="wrap" id="footer-text"></div></footer>
<div class="lightbox"><button class="close" aria-label="Chiudi">×</button><img src="" alt=""></div>

<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const FALLBACK_DATA={"data/sito.json":{"titolo_pagina":"I Sabbiastorie — Sand Art, voce e teatro","descrizione_pagina":"Spettacoli di Sand Art, narrazione e teatro con Vito Furio e Daniela. Fiabe, memoria, eventi, scuole e festival.","immagine_copertina":"assets/images/logo-copertina-sabbiastorie.webp","testo_copertina":"La sabbia racconta.","testo_sotto_copertina":"Sand Art, voce e teatro in un incontro vivo con il pubblico.","menu_chi_siamo":"Chi siamo","menu_spettacoli":"Spettacoli","menu_repertorio":"Repertorio","menu_galleria":"Galleria","menu_contatti":"Contatti","etichetta_chi_siamo":"Chi siamo","titolo_profilo":"La scena diventa un foglio di luce.","profilo_paragrafo_1":"I Sabbiastorie sono Vito Furio e Daniela Simula. La Sand Art prende forma davanti al pubblico mentre la voce accompagna personaggi, paesaggi e trasformazioni.","profilo_paragrafo_2":"Gli spettacoli uniscono immagine dal vivo, narrazione e teatro, con proposte per teatri, scuole, festival, biblioteche, piazze ed eventi culturali.","vito_nome":"Vito Furio","vito_ruolo":"Sand Artist, artista visivo e regia","daniela_nome":"Daniela Simula","daniela_ruolo":"Voce narrante e interpretazione","etichetta_spettacoli":"In scena","titolo_spettacoli":"Spettacoli","testo_spettacoli":"Fiabe, classici, memoria e proposte interattive raccontate attraverso immagini dal vivo, parola e teatro.","etichetta_repertorio":"Archivio","titolo_repertorio":"Il repertorio","testo_repertorio":"Una selezione dei progetti sviluppati nel tempo, adattabili a spazi, pubblici e occasioni differenti.","etichetta_galleria":"Immagini","titolo_galleria":"Galleria","testo_galleria":"Fotogrammi di Sand Art. Le immagini potranno essere sostituite con una selezione più rappresentativa.","frase":"La sabbia non conserva la forma: conserva il passaggio.","etichetta_contatti":"Contatti","titolo_contatti":"Portiamo una storia nel tuo spazio.","testo_contatti":"Per spettacoli, eventi culturali, scuole, festival, biblioteche e progetti speciali.","etichetta_email":"Email","etichetta_telefono":"Telefono e WhatsApp","email":"furiovito@gmail.com","telefono":"+39 333 334 4665","luogo":"Sardegna • disponibili per trasferte","url_sito":"https://i-sabbiastorie.furiovito.workers.dev/","testo_footer":"I Sabbiastorie — Sand Art, voce e teatro"},"data/spettacoli.json":[{"id":"peter-pan","titolo":"Peter Pan","categoria":"Fiabe e grandi classici","descrizione":"Sand Art e narrazione per attraversare l’Isola che non c’è, il volo, l’avventura e il desiderio di restare bambini.","immagine":"assets/images/peter-e-trilli.webp","in_evidenza":true,"ordine":10},{"id":"canto-di-natale","titolo":"Canto di Natale","categoria":"Spettacoli natalizi","descrizione":"Un racconto visivo ispirato al classico natalizio, tra memoria, trasformazione e possibilità di ricominciare.","immagine":"assets/images/cielo-stellato.webp","in_evidenza":true,"ordine":20},{"id":"bella-e-bestia","titolo":"La Bella e la Bestia","categoria":"Fiabe e grandi classici","descrizione":"Una storia di sguardi, paura e riconoscimento raccontata attraverso voce, musica e immagini che mutano nella sabbia.","immagine":"assets/images/wendy-alla-finestra.webp","in_evidenza":true,"ordine":30},{"id":"mary-poppins","titolo":"Mary Poppins","categoria":"Fiabe e grandi classici","descrizione":"Un viaggio poetico e musicale dove l’ordinario si apre alla meraviglia.","immagine":"assets/images/nave-e-volo.webp","in_evidenza":true,"ordine":40},{"id":"shoah","titolo":"Shoah","categoria":"Memoria e impegno civile","descrizione":"Teatro e Sand Art per custodire la memoria con rigore, delicatezza e forza visiva.","immagine":"assets/images/hero-sabbiastorie.webp","in_evidenza":true,"ordine":50},{"id":"piccolo-principe","titolo":"Il secondo viaggio del Piccolo Principe","categoria":"Fiabe e grandi classici","descrizione":"Un racconto di incontri, domande e paesaggi interiori, nato anche come presentazione del murale di Cargeghe.","immagine":"assets/images/isola-che-non-ce.webp","in_evidenza":true,"ordine":60},{"id":"inventastorie","titolo":"L’Inventastorie","categoria":"Spettacoli interattivi","descrizione":"Il pubblico offre parole, personaggi e luoghi: la storia prende forma dal vivo tra improvvisazione, voce e sabbia.","immagine":"assets/images/capitan-uncino.webp","in_evidenza":true,"ordine":70},{"id":"sotto-le-stelle","titolo":"I Sabbiastorie sotto le stelle","categoria":"Proposte estive","descrizione":"Una serata per piazze e spazi all’aperto con fiabe, musica, Sand Art e momenti interattivi.","immagine":"assets/images/nave-pirati.webp","in_evidenza":true,"ordine":80}],"data/repertorio.json":[{"titolo":"Bergel Circus","tipologia":"Teatro e Sand Art","ordine":10,"mostra":true},{"titolo":"La rivolta del presepe","tipologia":"Teatro e Sand Art","ordine":20,"mostra":true},{"titolo":"Iris, amami amore","tipologia":"Storia d’amore","ordine":30,"mostra":true},{"titolo":"Cappuccetto Rosso","tipologia":"Spettacolo comico, teatro e Sand Art","ordine":40,"mostra":true},{"titolo":"Il lupo che voleva fare la pizza","tipologia":"Teatro e Sand Art","ordine":50,"mostra":true},{"titolo":"Domo Mea — Il rifugio degli animali","tipologia":"Favola originale, teatro e Sand Art","ordine":60,"mostra":true},{"titolo":"Mini fiabe di Stellina","tipologia":"Sand Art e narrazione","ordine":70,"mostra":true},{"titolo":"Shoah","tipologia":"Teatro e Sand Art","ordine":80,"mostra":true},{"titolo":"Il rapimento di Babbo Natale","tipologia":"Teatro e Sand Art","ordine":90,"mostra":true},{"titolo":"Peter Pan","tipologia":"Sand Art e narrazione","ordine":100,"mostra":true},{"titolo":"Canto di Natale","tipologia":"Sand Art e narrazione","ordine":110,"mostra":true},{"titolo":"Sant’Antoni e Su Fogu","tipologia":"Sand Art e narrazione","ordine":120,"mostra":true},{"titolo":"Il secondo viaggio del Piccolo Principe","tipologia":"Narrazione e Sand Art","ordine":130,"mostra":true},{"titolo":"L’Inventastorie","tipologia":"Improvvisazione interattiva","ordine":140,"mostra":true},{"titolo":"Meravigliamoci","tipologia":"Presentazione di progetto","ordine":150,"mostra":true},{"titolo":"La Jana e il pastore innamorato","tipologia":"Kamishibai","ordine":160,"mostra":true},{"titolo":"La Bella e la Bestia","tipologia":"Sand Art e narrazione","ordine":170,"mostra":true},{"titolo":"Mary Poppins","tipologia":"Sand Art e narrazione","ordine":180,"mostra":true}],"data/galleria.json":[{"titolo":"Peter e Trilli","immagine":"assets/images/peter-e-trilli.webp","ordine":10,"mostra":true},{"titolo":"L’Isola che non c’è","immagine":"assets/images/isola-che-non-ce.webp","ordine":20,"mostra":true},{"titolo":"Il coccodrillo","immagine":"assets/images/coccodrillo.webp","ordine":30,"mostra":true},{"titolo":"La nave e il volo","immagine":"assets/images/nave-e-volo.webp","ordine":40,"mostra":true},{"titolo":"Capitan Uncino","immagine":"assets/images/capitan-uncino.webp","ordine":50,"mostra":true},{"titolo":"Il cielo stellato","immagine":"assets/images/cielo-stellato.webp","ordine":60,"mostra":true},{"titolo":"Wendy alla finestra","immagine":"assets/images/wendy-alla-finestra.webp","ordine":70,"mostra":true},{"titolo":"La nave dei pirati","immagine":"assets/images/nave-pirati.webp","ordine":80,"mostra":true}]};
async function loadJSON(url){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(url);return await r.json()}catch(e){return FALLBACK_DATA[url]}}
(async()=>{
  const [sito,spettacoli,repertorio,galleria]=await Promise.all([
    loadJSON('data/sito.json'),loadJSON('data/spettacoli.json'),loadJSON('data/repertorio.json'),loadJSON('data/galleria.json')
  ]);

  document.title=sito.titolo_pagina;
  document.querySelector('meta[name="description"]').content=sito.descrizione_pagina;
  document.getElementById('hero-image').src=sito.immagine_copertina;
  document.getElementById('hero-text').textContent=sito.testo_copertina;
  document.getElementById('hero-subtext').textContent=sito.testo_sotto_copertina;

  document.getElementById('menu-chi').textContent=sito.menu_chi_siamo;
  document.getElementById('menu-spettacoli').textContent=sito.menu_spettacoli;
  document.getElementById('menu-repertorio').textContent=sito.menu_repertorio;
  document.getElementById('menu-galleria').textContent=sito.menu_galleria;
  document.getElementById('menu-contatti').textContent=sito.menu_contatti;

  document.getElementById('label-chi').textContent=sito.etichetta_chi_siamo;
  document.getElementById('profile-title').textContent=sito.titolo_profilo;
  document.getElementById('profile-p1').textContent=sito.profilo_paragrafo_1;
  document.getElementById('profile-p2').textContent=sito.profilo_paragrafo_2;
  document.getElementById('vito-name').textContent=sito.vito_nome;
  document.getElementById('vito-role').textContent=sito.vito_ruolo;
  document.getElementById('daniela-name').textContent=sito.daniela_nome;
  document.getElementById('daniela-role').textContent=sito.daniela_ruolo;

  document.getElementById('label-shows').textContent=sito.etichetta_spettacoli;
  document.getElementById('title-shows').textContent=sito.titolo_spettacoli;
  document.getElementById('text-shows').textContent=sito.testo_spettacoli;

  document.getElementById('label-rep').textContent=sito.etichetta_repertorio;
  document.getElementById('title-rep').textContent=sito.titolo_repertorio;
  document.getElementById('text-rep').textContent=sito.testo_repertorio;

  document.getElementById('label-gallery').textContent=sito.etichetta_galleria;
  document.getElementById('title-gallery').textContent=sito.titolo_galleria;
  document.getElementById('text-gallery').textContent=sito.testo_galleria;

  document.getElementById('quote').textContent='“'+sito.frase+'”';

  document.getElementById('label-contacts').textContent=sito.etichetta_contatti;
  document.getElementById('contact-title').textContent=sito.titolo_contatti;
  document.getElementById('contact-text').textContent=sito.testo_contatti;
  document.getElementById('email-label').textContent=sito.etichetta_email;
  document.getElementById('phone-label').textContent=sito.etichetta_telefono;

  const email=document.getElementById('email-link');
  email.href='mailto:'+sito.email;email.querySelector('span').textContent=sito.email;
  const phone=document.getElementById('phone-link');
  phone.href='https://wa.me/'+sito.telefono.replace(/\D/g,'');phone.querySelector('span').textContent=sito.telefono;
  document.getElementById('location').textContent=sito.luogo;
  document.getElementById('footer-text').textContent=sito.testo_footer+' — '+new Date().getFullYear();

  document.getElementById('cards').innerHTML=spettacoli
    .filter(x=>x.in_evidenza)
    .sort((a,b)=>Number(a.ordine)-Number(b.ordine))
    .map(x=>`
      <article class="card">
        <div class="card-image"><img src="${esc(x.immagine)}" alt="${esc(x.titolo)}"></div>
        <div class="card-body"><span class="tag">${esc(x.categoria)}</span><h3>${esc(x.titolo)}</h3><p>${esc(x.descrizione)}</p></div>
      </article>`).join('');

  document.getElementById('rep-list').innerHTML=repertorio
    .filter(x=>x.mostra!==false)
    .sort((a,b)=>Number(a.ordine)-Number(b.ordine))
    .map(x=>`<div class="rep-item"><strong>${esc(x.titolo)}</strong><small>${esc(x.tipologia)}</small></div>`).join('');

  const gal=document.getElementById('gallery');
  gal.innerHTML=galleria
    .filter(x=>x.mostra!==false)
    .sort((a,b)=>Number(a.ordine)-Number(b.ordine))
    .map(x=>`<figure class="shot"><img src="${esc(x.immagine)}" alt="${esc(x.titolo)}"><figcaption>${esc(x.titolo)}</figcaption></figure>`).join('');

  const lb=document.querySelector('.lightbox'),lbimg=lb.querySelector('img');
  gal.querySelectorAll('.shot img').forEach(img=>img.addEventListener('click',()=>{lbimg.src=img.src;lbimg.alt=img.alt;lb.classList.add('open')}));
  lb.querySelector('.close').onclick=()=>lb.classList.remove('open');
  lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});
})().catch(console.error);
</script>
</body>
</html>
